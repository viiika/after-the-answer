<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答案之后 · 实验工坊</title><link rel="stylesheet" href="style.css"><body><header><a href="../v75/start.html">← 故事档案</a><span>玩法重构 · 可玩实验</span></header><main><p class="eyebrow">AFTER THE ANSWER / WORKSHOP</p><h1>答案，自己接起来。</h1><p>把左侧光源送进右侧接收器。旋转、替换或拆下管件，然后运行。无需阅读剧情。</p><nav id="levels"></nav><section class="layout"><div><div class="board" id="board" aria-label="八列六行装置"></div><div class="controls"><button id="run">▶ 运行装置</button><button id="undo">撤销</button><button id="reset">重置本关</button><button id="clear">清空工作台</button></div></div><aside><h2 id="name"></h2><p id="goal"></p><div id="tools"></div><p>旋转：点击管件。替换：先选工具，再点格子。空格或回车也能操作。桥接件让两条管道交叉而不连通。</p><output id="feedback" aria-live="polite">先观察两端，再试一次。</output><p id="stats"></p><button id="hint">查看一个局部提示</button><label><input type="checkbox" id="motion"> 减少动态</label></aside></section><section class="notes"><h2>这次测试什么</h2><p>你能否不看剧本就弄懂规则？失败时能否看出哪一处断开？解开以后，会不会想用更少零件再做一次？这里不评价你的故事选择。它是新玩法的验证场，尚未替换整部游戏。</p></section></main><script src="model.js"></script><script src="app.js"></script></body></html>
