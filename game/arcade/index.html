<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星际打捞机 · 答案之后</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="../v75/start.html" data-word="back"></a><span data-word="standalone"></span><select id="language" aria-label="Language"><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="ar">العربية</option><option value="hi">हिन्दी</option><option value="ja">日本語</option></select></header>
<main><div class="heading"><div><p class="eyebrow">THE LITTLE ORBIT ARCADE</p><h1 data-word="title"></h1><p class="intro" data-word="intro"></p></div><div class="score"><small data-word="haul"></small><strong id="score">0 / 6</strong></div></div>
<section class="setup"><div class="modes" role="group" aria-label="Mode"><button data-mode="practice" data-word="practice"></button><button data-mode="mission" data-word="mission"></button><button data-mode="drift" data-word="drift"></button></div><p id="objective"></p></section>
<section class="cabinet"><canvas id="game" width="900" height="520" tabindex="0" aria-describedby="help objective"></canvas><div class="console"><div class="readout"><span class="led"></span><output id="feedback" aria-live="polite"></output></div><div class="instruments"><div class="gears" role="group" aria-label="Claw"><button data-gear="fine" data-word="fine"></button><button data-gear="wide" data-word="wide"></button></div><label><span data-word="steady"></span><meter id="steady" min="0" max="1" value="1"></meter></label></div><div class="buttons" dir="ltr"><button id="left">◀</button><button id="drop"><span data-word="drop"></span><kbd>SPACE</kbd></button><button id="right">▶</button></div></div></section>
<section class="bottom"><div><p id="status"></p><p id="points"></p></div><button id="restart" data-word="restart"></button></section>
<div class="preferences"><button id="pause" data-word="pause"></button><label><input type="checkbox" id="sound"><span data-word="sound"></span></label><label><input type="checkbox" id="motion"><span data-word="motion"></span></label></div>
<p id="help" class="help" data-word="help"></p><p class="help" data-word="precision"></p>
<section class="collection"><div class="collection-title"><h2 data-word="shelf"></h2><span id="collection-count"></span></div><p class="help" data-word="aimHint"></p><div id="shelf"></div><p class="help" data-word="shelfNote"></p><p id="storage-warning" class="help" role="status"></p></section>
</main><script src="model.js"></script><script src="i18n.js"></script><script src="game.js"></script></body></html>
